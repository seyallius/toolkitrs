# .github/workflows/release-plz.yml
# Semantic release orchestration using reusable workflows.
# Chains asset build/release automatically when a new version is published.

name: Semantic Release (release-plz)

on:
  push:
    branches:
      - main

jobs:
  release:
    uses: seyallius/github-workflows/.github/workflows/release-plz.yml@v0.4.1
    with:
      branch: main  # Or 'master' if you use that
    secrets:
      RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Auto-chain assets on successful release
  build-assets:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    uses: seyallius/github-workflows/.github/workflows/build-assets.yml@v0.4.1
    with:
      binary_name: toolkitrs

  publish-assets:
    needs: [release, build-assets]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    uses: seyallius/github-workflows/.github/workflows/release-assets.yml@v0.4.1
    with:
      artifact_pattern: toolkitrs*
      generate_release_notes: true
      tag_name: ${{ needs.release.outputs.tag_name }}