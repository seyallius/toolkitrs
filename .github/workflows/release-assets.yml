# .github/workflows/release-assets.yml
# Manual-only binary release workflow.
# Use this when you need binaries WITHOUT publishing to crates.io.
# Examples: hotfix assets, testing packaging, rebuilding corrupted releases.

name: Build & Release Binaries (Manual)

on:
  # Manual fallback: lets you build + release for any existing tag
  # without having to delete and re-push it.
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build and release (e.g. v0.1.9)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    uses: seyallius/github-workflows/.github/workflows/build-assets.yml@v0.4.1
    with:
      binary_name: toolkitrs
      # You can also override targets, build_command, etc. if needed.
      # targets: x86_64-unknown-linux-gnu,x86_64-pc-windows-msvc

  release:
    needs: build
    uses: seyallius/github-workflows/.github/workflows/release-assets.yml@v4
    with:
      artifact_pattern: toolkitrs*                      # Matches your binary_name used in the build
      generate_release_notes: false                     # Don't overwrite existing notes
      draft: false                                      # Optional, defaults to false
      prerelease: false                                 # Optional, defaults to false
      tag_name: ${{ inputs.tag || github.ref_name }}    # Pass the manual tag through if provided, otherwise fall back to ref_name
